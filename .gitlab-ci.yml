image: registry.gitlab.com/spritely/guile-goblins:latest

stages:
  - build
  - coverage

unit-tests:
  stage: build
  script:
    - sh ./bootstrap.sh
    - ./configure
    - make distcheck
    # Check we can build the HTML docs
    - make html
    # Finally run make check and generate the JUnit report for Gitlab.
    - make check -j$(nproc)
    - make combine-junit-xml-results
  artifacts:
    reports:
      junit: 'test-results.xml'

perf-tests:
  stage: build
  script:
    - sh ./bootstrap.sh
    - ./configure
    - make -j$(nproc)
    - ./pre-inst-env guile --no-auto-compile -e main misc/perf-tests.scm > perf-metrics.txt
  artifacts:
    reports:
      metrics: 'perf-metrics.txt'

code-coverage:
  stage: coverage
  script:
    # Configure & Build
    - sh ./bootstrap.sh
    - ./configure
    - make
    # Run the tests with coverage on.
    - ./pre-inst-env guile ./misc/coverage.scm
    # Convert the generated lcov into something Gitlab understands (Cobertura formatted XML file)
    - ./misc/lcov_to_xml.py > coverage.xml
  # From: https://docs.gitlab.com/ee/ci/testing/test_coverage_visualization.html
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
